# Supabase CLI 設定（本地）
# 詳見 https://supabase.com/docs/guides/cli/config

# 必填：用於 `supabase link --project-ref <REF>` 時對齊；本地不會用到
project_id = "dudu-info"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# 本地預設不啟用 inbucket（測試用 mail）；如需測試 magic link 自行打開
[inbucket]
enabled = false
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback/line"]
jwt_expiry = 3600
enable_signup = false  # 本案不用 Supabase Auth，會員端走 Auth.js

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
